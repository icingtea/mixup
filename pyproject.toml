[tool.uv.workspace]
members = [
    "packages/mixup-core",
    "packages/mixup-node",
    "packages/mixup-orchestrator",
    "packages/mixup-repl",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "packages/mixup-core/src",
    "packages/mixup-node/src",
    "packages/mixup-orchestrator/src",
    "packages/mixup-repl/src",
]
extend-exclude = [".temp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
