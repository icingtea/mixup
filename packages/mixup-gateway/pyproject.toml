[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mixup-gateway"
version = "0.1.0"
description = "A stable HTTP front door that hides leader failover from clients."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.27.0",
    "mixup-core",
    "uvicorn>=0.30.0",
]

[project.scripts]
mixup-gateway = "mixup_gateway.gateway:main"

[tool.uv.sources]
mixup-core = { workspace = true }
