[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mixup-orchestrator"
version = "0.1.0"
description = "Host-side Docker orchestration for distributed MoE inference."
requires-python = ">=3.13"
dependencies = [
    "docker[ssh]>=7.2.0",
    "huggingface_hub>=0.30.0",
    "mixup-core",
]

[project.scripts]
mixup-fetch-model = "mixup_orchestrator.fetch:main"
mixup-lab = "mixup_orchestrator.lab:main"

[tool.uv.sources]
mixup-core = { workspace = true }
