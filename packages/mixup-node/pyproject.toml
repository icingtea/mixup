[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mixup-node"
version = "0.1.0"
description = "In-container runtime for distributed MoE inference: loads its experts and serves them."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "mixup-core",
    "requests>=2.34.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.24.1",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
mixup-core = { workspace = true }
