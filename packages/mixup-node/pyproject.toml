[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mixup-node"
version = "0.1.0"
description = "In-container runtime for distributed MoE inference: loads its experts and serves them."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "huggingface_hub>=0.30.0",
    "mixup-core",
    "pydantic>=2.14.2",
    "requests>=2.34.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.24.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
mixup-node = "mixup_node.infer:start"
mixup-node-fetch = "mixup_node.fetch:main"

[tool.uv.sources]
mixup-core = { workspace = true }
# On ARM64 (the CPU-only Pis) pull torch from the CPU index, which has no CUDA
# deps; on x86_64 it stays on PyPI (CUDA + nvidia-*).
torch = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
