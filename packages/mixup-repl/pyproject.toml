[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[project]
name = "mixup-repl"
version = "0.1.0"
description = "Host-side CLI to prompt the running mixup cluster."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "mixup-core",
]

[project.scripts]
mixup-repl = "mixup_repl.repl:main"

[tool.uv.sources]
mixup-core = { workspace = true }
